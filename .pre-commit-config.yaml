repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
    -   id: check-ast
    -   id: check-json
    -   id: check-merge-conflict
    -   id: detect-private-key

-   repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.11.0
    hooks:
    -   id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
    -   id: ruff
        args: [--fix, --exit-non-zero-on-fix]
    -   id: ruff-format

-   repo: local
    hooks:
    # A skill that names a tool the server does not expose does not fail loudly:
    # the model calls it, gets `unknown tool`, and that path stops working while
    # the file still reads as correct. Stdlib only, so no extra dependency.
    -   id: validate-skill-tools
        name: skills and routing docs name real MCP tools
        entry: python3 scripts/validate_skill_tools.py
        language: system
        pass_filenames: false
        files: ^(skills/|cursor-plugin/|codex-plugin/|\.agents/|CLAUDE\.md|scripts/known_tools\.json)
    -   id: validate-skill-tools-self-test
        name: the skill-tool checker's own tests
        entry: python3 scripts/validate_skill_tools.py --self-test
        language: system
        pass_filenames: false
        files: ^scripts/validate_skill_tools\.py$
